<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }

        .login-box{
            width: 420px;
            background: rgba(255,255,255,0.9);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .login-box h1{
            text-align: center;
            font-size: 55px;
            margin-bottom: 35px;
            font-weight: bold;
        }

        .form-group{
            margin-bottom: 25px;
        }

        label{
            display: block;
            margin-bottom: 10px;
            font-size: 18px;
        }

        input[type="email"],
        input[type="password"]{
            width: 100%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 18px;
            outline: none;
        }

        input:focus{
            border-color: #1d4ed8;
            box-shadow: 0 0 5px rgba(29,78,216,0.5);
        }

        .remember{
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            font-size: 18px;
        }

        button{
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(to right, #0047ff, #005eff);
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover{
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Đăng nhập</h1>

        <form>

            <div class="form-group">
                <label>Email:</label>
                <input type="email" placeholder="Nhập email">
            </div>

            <div class="form-group">
                <label>Mật khẩu:</label>
                <input type="password" placeholder="Nhập mật khẩu">
            </div>

            <div class="remember">
                <input type="checkbox">
                <span>Ghi nhớ đăng nhập</span>
            </div>

            <button type="submit">Đăng nhập</button>

        </form>

    </div>

</body>
</html>
