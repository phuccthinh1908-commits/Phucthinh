<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Tài Khoản</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #dbeafe, #bfdbfe);
        }

        .container{
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .container h1{
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        .container p{
            text-align: center;
            color: gray;
            margin-bottom: 30px;
        }

        .form-group{
            margin-bottom: 20px;
        }

        label{
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"]{
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        .checkbox{
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        button{
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #0057ff;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover{
            background: #0041c4;
        }

        .login{
            text-align: center;
            margin-top: 20px;
        }

        .login a{
            color: #0057ff;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>TẠO TÀI KHOẢN</h1>
        <p>Nhanh chóng và dễ dàng.</p>

        <form>

            <div class="form-group">
                <label>Họ và tên</label>
                <input type="text">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" placeholder="Nhập mật khẩu">
            </div>

            <div class="form-group">
                <label>Xác nhận mật khẩu</label>
                <input type="password" placeholder="Nhập lại mật khẩu">
                </div>

            <div class="checkbox">
                <input type="checkbox">
                <span>Tôi đồng ý với điều khoản</span>
            </div>

            <button type="submit">Đăng ký ngay</button>

            <div class="login">
                Bạn đã có tài khoản?
                <a href="#">Đăng nhập tại đây</a>
            </div>

        </form>
    </div>

</body>
</html
